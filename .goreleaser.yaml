# Builds projgen for every platform when a v* tag is pushed
# (.github/workflows/release.yml). Try it locally without publishing:
#   goreleaser release --snapshot --clean
version: 2

project_name: projgen

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: projgen
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
