# End-to-end checks of what projgen generates:
#   generated - every framework x architecture x database combination, with
#               and without entities, built and tested with the latest
#               versions from the official sources
#   database  - generated repositories run against real PostgreSQL and MySQL
#   java      - every Java (Spring Boot) combination built with ./mvnw verify
# Opens an issue when a scheduled or push run fails.
name: e2e

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (09:00 Ulaanbaatar)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "internal/generator/**"
      - "internal/entity/**"
      - "internal/versions/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and test generated projects (latest versions)
        env:
          PROJGEN_E2E: "1"
          PROJGEN_E2E_LATEST: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -run 'TestGenerated_BuildAndTest|TestAdded_BuildAndTest' -timeout 40m ./internal/generator ./internal/entity

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:9.7
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generated cache against a real Redis
        env:
          PROJGEN_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -count=1 -run TestGenerated_RedisCache -v -timeout 10m ./internal/generator

      - name: Generated repositories against real databases
        env:
          # Throwaway credentials of the CI service containers above.
          PROJGEN_TEST_POSTGRES_URL: postgres://app:app@localhost:5432/app?sslmode=disable
          PROJGEN_TEST_MYSQL_URL: app:app@tcp(localhost:3306)/app?parseTime=true
        run: go test -count=1 -run TestAdded_RealDatabase -v -timeout 15m ./internal/entity

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:9.7
        env:
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_DATABASE: app
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Generated projects target the newest Java LTS, so test with that JDK.
      - name: Find the latest Java LTS
        id: lts
        run: echo "version=$(curl -fsS https://api.adoptium.net/v3/info/available_releases | jq -r .most_recent_lts)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.lts.outputs.version }}

      - name: Build and test generated Java projects (latest versions)
        env:
          PROJGEN_E2E_JAVA: "1"
          PROJGEN_E2E_LATEST: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -run TestGeneratedJava_BuildAndTest -timeout 40m ./internal/generator

      - name: Build and test Java projects with entities
        env:
          PROJGEN_E2E_JAVA: "1"
        run: go test -count=1 -run TestAddedJava_BuildAndTest -timeout 40m ./internal/entity

      - name: Flyway migrations and JDBC repositories against real databases
        env:
          PROJGEN_E2E_JAVA: "1"
          # Throwaway credentials of the CI service containers above.
          PROJGEN_TEST_POSTGRES_JDBC: jdbc:postgresql://localhost:5432/app
          PROJGEN_TEST_MYSQL_JDBC: jdbc:mysql://localhost:3306/app
          PROJGEN_TEST_DB_USER: app
          PROJGEN_TEST_DB_PASSWORD: app
        run: |
          go test -count=1 -run TestGeneratedJava_RealDatabase -v -timeout 20m ./internal/generator
          go test -count=1 -run TestAddedJava_RealDatabase -v -timeout 20m ./internal/entity

  report:
    needs: [generated, database, java]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue (once)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="E2E: generated projects fail"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)"
          if [ "$open" != "0" ]; then
            echo "An issue is already open; not creating another."
            exit 0
          fi
          gh issue create --title "$title" --body "An E2E run failed: $RUN_URL

          Check whether a new version from the official sources broke a template (job: generated) or a generated repository fails on a real database (job: database)."
